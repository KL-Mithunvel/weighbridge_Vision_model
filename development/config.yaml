# Configuration for the AWS S3 access + Gate 1 image-inventory tooling.
# All tunables live here — never hardcode them in aws_s3.py / inventory_s3.py.
# Paths are relative to the repository root.

s3:
  bucket: "smtw-weighbridge-archive"
  # Region of the bucket. S3 -> bucket -> Properties -> AWS Region.
  # Overridden by AWS_DEFAULT_REGION in the environment / .env if set there.
  region: "ap-south-1"
  # Restrict the crawl to these key prefixes. Empty string = whole bucket.
  # Add more once the folder layout is known (e.g. "gross/", "tare/", "2026/").
  prefixes:
    - ""
  # Hard cap on objects listed, as a safety brake on a first run against an
  # unknown bucket. null = no limit (list everything).
  max_objects: null

inventory:
  # File extensions counted as images (lower-cased comparison).
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  # How many image objects to actually download to probe real resolution /
  # format / mode. Kept small — this is a sample, not a full pull.
  resolution_sample_size: 40
  # Seed for the resolution sample so a re-run probes the same objects.
  sample_seed: 42
  # Regex applied to each object key to pull out a transaction/serial id and a
  # gross/tare tag, so the inventory can report how photos pair to the SQL
  # reports (docs/DATA_AUDIT.md). Leave null until the real key format is known;
  # the inventory still runs and just skips the pairing breakdown.
  # Real layout (confirmed 2026-09-20 by the first crawl):
  #   weighments-YYYYMM/<YYYY-MM-DD-NNN>/<YYYYMMDD_HHMMSS_hash>.jpg
  # The folder is the report serial; SQL stores the same serial without the
  # date dashes (S3 '2026-03-07-001' == SQL '20260307-001'). Filenames carry
  # NO gross/tare tag, so only the serial group is captured here.
  # Two folder conventions exist: dashed 'YYYY-MM-DD-NNN' (688 serials) and
  # flat 'YYYYMMDD-NNN' (12 serials, 2026-03-06/07 only). Both are matched;
  # 4 serials appear under BOTH and are therefore double-counted here.
  key_pattern: '(?P<serial>\d{4}-\d{2}-\d{2}-\d{3}|\d{8}-\d{3})'
  # Example once the layout is known, e.g. keys like
  #   "2026/20260306-001/gross_1.jpg"
  # key_pattern: '(?P<serial>\d{8}-\d{3}).*(?P<state>gross|tare)'

paths:
  # Full per-object listing (key, size, last-modified, etag, storage class).
  # Under data/ -> gitignored. This is the raw crawl output.
  objects_jsonl: "data/s3_inventory/s3_objects.jsonl"
  # Downloaded resolution-probe samples. Gitignored.
  sample_dir: "data/s3_inventory/samples"
  # Aggregated, committed audit record — counts and histograms only, no image
  # content. This is the Gate 1 artefact that goes in git.
  summary_json: "docs/data_inventory/s3_summary.json"

# --------------------------------------------------------------------------- #
# Entry viewer + labelling GUI (development/entry_viewer/). Reuses s3.bucket,  #
# s3.region, s3.prefixes, inventory.key_pattern and paths.objects_jsonl above. #
# --------------------------------------------------------------------------- #
viewer:
  # Local only — the app uses your AWS keys; never bind to 0.0.0.0.
  host: "127.0.0.1"
  port: 5050
  # Downloaded originals + thumbnails. Gitignored (under data/). Every object
  # is GLACIER_IR, so the cache is what keeps retrieval fees one-off.
  cache_dir: "data/viewer_cache"
  thumb_max_px: 360
  thumb_jpeg_quality: 80
  # SQL verdicts from the existing LLM audit system. Opened READ-ONLY.
  reports_db: "data/wb_ai_reports.sqlite3"
  reports_table: "ai_report_fields"
  # Human labels written by the GUI. Gitignored; export a JSON snapshot to
  # commit as the audit trail once labelling is under way.
  labels_db: "data/labels/labels.sqlite3"
  # Photos further apart than this start a new "visit". PROVISIONAL — the
  # DATA_AUDIT.md clustering that put 690/700 serials into exactly 2 visits.
  visit_gap_minutes: 5
  # Image-role GUESS (docs/ENTRY_ANATOMY.md). PROVISIONAL — validated on one
  # entry. Resolution is used once an image is cached; before that, size only.
  role_guess:
    by_resolution:
      "2688x1520": "cctv_indoor"
      "1920x1080": "cctv_platform"
      "4160x1920": "phone"
    # 0.8 MiB — the CCTV/phone byte-size split from ENTRY_ANATOMY.md.
    cctv_max_bytes: 838861
    small_unknown: "cctv?"
    large_unknown: "phone_irregular"   # cropped phone shot OR weigh slip
  # Labelling vocabulary. The GUI renders exactly these choices; the server
  # rejects anything else. Adding a value is safe; renaming one orphans
  # existing labels, so don't.
  labels:
    photo:
      role: ["cctv_indoor", "cctv_platform", "phone_load", "weigh_slip", "other"]
      visit: ["gross", "tare", "unsure"]
      load_state: ["loaded", "empty", "partial", "not_visible"]
      material: ["firewood", "not_firewood", "mixed", "unsure", "n/a"]
      residue: ["clean", "residue", "unsure", "n/a"]
    entry:
      visit_split_correct: ["yes", "no", "unsure"]
      vehicle_same_both_visits: ["yes", "no", "unsure"]
      suspect: ["no", "yes", "unsure"]
